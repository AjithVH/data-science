<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPLE ECOMMERCE:UPCODE</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      .card-img-top {
        height: 150px; /* Adjust the image height */
        object-fit: contain;
      }
      .card-body {
        padding: 10px; /* Reduce padding inside the card */
      }
      .card-title {
        font-size: 1rem; /* Adjust font size for title */
      }
      .card-text {
        font-size: 0.875rem; /* Adjust font size for text */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
        <div class="container-fluid">
          <a class="navbar-brand" href="index..html">UPCODE ECOMMERCE</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.htm">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="products.html">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact Us</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>

      <div class="row g-3" id="productscontainer"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      function createProductCard(p) {
        return `
        <div class="col-lg-3 col-md-4 col-sm-6">
          <div class="card h-100">
            <img src="${p.image}" class="card-img-top" alt="Product Image">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${p.title}</h5>
              <p class="card-text">₹${p.price}</p>
              <a href="#" class="btn btn-primary mt-auto">ADD TO CART</a>
            </div>
          </div>
        </div>
      `;
      }

      async function getProducts() {
        try {
          const response = await fetch("https://fakestoreapi.com/products");
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          const products = await response.json();
          let productlistcontainer = "";
          for (let p of products) {
            const ProductContainer = createProductCard(p);
            productlistcontainer += ProductContainer;
          }
          const productscontainer = document.getElementById("productscontainer");
          productscontainer.innerHTML = productlistcontainer;
        } catch (error) {
          console.error('There has been a problem with your fetch operation:', error);
          const productscontainer = document.getElementById("productscontainer");
          productscontainer.innerHTML = "<div class='col-12'><p class='text-danger'>Failed to load products. Please try again later.</p></div>";
        }
      }

      getProducts();
    </script>
  </body>
</html>
